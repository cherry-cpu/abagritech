<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Examiner Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Examiner Login</h2>
        <p>Authorized Access Only</p>

        <div class="msg error" id="errorMsg"></div>

        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
    </div>
</div>

<script>
const form=document.getElementById("loginForm");
const error=document.getElementById("errorMsg");
const btn=document.getElementById("loginBtn");

form.addEventListener("submit",e=>{
    e.preventDefault();
    error.textContent="";
    btn.disabled=true;

    fetch("exam_auth.php",{method:"POST",body:new FormData(form)})
    .then(r=>r.json())
    .then(d=>{
        if(d.success) location.href="exam_marks_enter.php";
        else{
            error.textContent=d.message;
            btn.disabled=false;
        }
    });
});
</script>

</body>
</html>
